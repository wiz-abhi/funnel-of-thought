<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img">
  <style>
    text { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .h1  { font-size: 19px; font-weight: 600; fill: #e6edf3; }
    .sub { font-size: 12.5px; fill: #a8bccd; }
    .cap { font-size: 11.5px; fill: #a8bccd; letter-spacing: 1.4px; }
    .num { font-size: 46px; font-weight: 700; }
    .stat{ font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .lbl { font-size: 11.5px; fill: #a8bccd; }
    .val { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .foot{ font-size: 11.5px; fill: #8296a8; }
    .joke{ font-size: 15px; fill: #e6edf3; }
    .tag { font-size: 11.5px; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="800" height="490" fill="#0f1720"/>

  <text class="h1" x="40" y="44">validate step compliance, measured two ways</text>
  <text class="sub" x="760" y="44" text-anchor="end">n = 125 traces</text>
  <rect x="40" y="90" width="345" height="310" rx="14" fill="#16212e" stroke="#2b3b4d" stroke-width="1.5"/>
  <text class="cap" x="64" y="121">the counter</text>
  <rect x="296" y="106" width="64" height="22" rx="11" fill="#1d3a30" stroke="#24614c"/>
  <text class="tag" x="328" y="121.5" text-anchor="middle" fill="#4cc294">pass</text>
  <text class="num" x="212" y="190" text-anchor="middle" fill="#4cc294">100.0%</text>
  <text class="stat" x="212" y="218" text-anchor="middle">validate step: PASSING</text>
  <line x1="64" y1="238" x2="361" y2="238" stroke="#2b3b4d"/>
  <text class="foot" x="212" y="388" text-anchor="middle">counts spans. order is not considered.</text>
