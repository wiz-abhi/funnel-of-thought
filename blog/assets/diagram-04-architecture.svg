<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Architecture: a four-node agent exports OTLP to SigNoz, which is read by the Trace Funnels REST API, an MCP server, and a dashboard-as-code alert.">
  <title>How it fits together</title>
  <defs>
    <marker id="d4Arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6d8aa6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#0f1720"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- header -->
    <text x="32" y="42" font-size="23" font-weight="600" fill="#e6edf3">How it fits together</text>
    <text x="32" y="68" font-size="14" fill="#93a4b5">OpenTelemetry in, three read paths out.</text>

    <!-- ============ GROUP : observed system ============ -->
    <text x="24" y="224" font-size="11" font-weight="700" letter-spacing="1.3" fill="#6f8398">OBSERVED SYSTEM</text>
    <rect x="20" y="232" width="446" height="152" rx="12" fill="none" stroke="#243343" stroke-width="1.2" stroke-dasharray="6 5"/>

    <!-- NODE A : the agent -->
    <rect x="32" y="252" width="168" height="112" rx="10" fill="#16212e" stroke="#4cc294" stroke-width="1.3"/>
    <text x="116" y="294" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">4-node agent</text>
    <text x="116" y="316" font-size="11.5" fill="#8fa3b8" text-anchor="middle">OTel SDK &#183; Gemini</text>
    <text x="116" y="336" font-size="11" fill="#6f8398" text-anchor="middle">the only LLM call lives here</text>

    <!-- A -> B -->
    <line x1="200" y1="308" x2="278" y2="308" stroke="#6d8aa6" stroke-width="1.6" marker-end="url(#d4Arrow)"/>
    <text x="243" y="294" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9fb8cc" text-anchor="middle">OTLP :4318</text>

    <!-- NODE B : SigNoz -->
    <rect x="286" y="252" width="168" height="112" rx="10" fill="#16212e" stroke="#3a5470" stroke-width="1.3"/>
    <text x="370" y="300" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">SigNoz</text>
    <text x="370" y="322" font-size="11.5" fill="#8fa3b8" text-anchor="middle">ClickHouse</text>

    <!-- ============ fan-out bus ============ -->
    <g stroke="#6d8aa6" stroke-width="1.6" fill="none">
      <line x1="454" y1="308" x2="492" y2="308"/>
      <line x1="492" y1="186" x2="492" y2="430"/>
      <line x1="492" y1="186" x2="522" y2="186" marker-end="url(#d4Arrow)"/>
      <line x1="492" y1="308" x2="522" y2="308" marker-end="url(#d4Arrow)"/>
      <line x1="492" y1="430" x2="522" y2="430" marker-end="url(#d4Arrow)"/>
    </g>
    <circle cx="492" cy="308" r="3.5" fill="#6d8aa6"/>

    <!-- ============ READ PATHS ============ -->
    <text x="530" y="118" font-size="11" font-weight="700" letter-spacing="1.3" fill="#6f8398">READ PATHS</text>

    <!-- consumer a -->
    <rect x="530" y="130" width="338" height="112" rx="10" fill="#16212e" stroke="#27384a" stroke-width="1"/>
    <circle cx="562" cy="164" r="11" fill="#1e2b3a" stroke="#6d8aa6" stroke-width="1"/>
    <text x="562" y="168" font-size="11.5" font-weight="700" fill="#a8bccd" text-anchor="middle">a</text>
    <text x="586" y="164" font-size="14.5" font-weight="600" fill="#e6edf3">Trace Funnels REST API</text>
    <text x="586" y="188" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9fb8cc">&#8594; fot CLI</text>
    <text x="586" y="212" font-size="12.5" fill="#7d93a8">renders the drop-off cliff in the terminal</text>

    <!-- consumer b -->
    <rect x="530" y="252" width="338" height="112" rx="10" fill="#16212e" stroke="#27384a" stroke-width="1"/>
    <circle cx="562" cy="286" r="11" fill="#1e2b3a" stroke="#6d8aa6" stroke-width="1"/>
    <text x="562" y="290" font-size="11.5" font-weight="700" fill="#a8bccd" text-anchor="middle">b</text>
    <text x="586" y="286" font-size="14.5" font-weight="600" fill="#e6edf3">signoz-funnel-mcp</text>
    <text x="586" y="310" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9fb8cc">3 MCP tools</text>
    <text x="586" y="334" font-size="12.5" fill="#7d93a8">an agent reads a funnel over itself</text>

    <!-- consumer c -->
    <rect x="530" y="374" width="338" height="112" rx="10" fill="#16212e" stroke="#27384a" stroke-width="1"/>
    <circle cx="562" cy="408" r="11" fill="#1e2b3a" stroke="#6d8aa6" stroke-width="1"/>
    <text x="562" y="412" font-size="11.5" font-weight="700" fill="#a8bccd" text-anchor="middle">c</text>
    <text x="586" y="408" font-size="14.5" font-weight="600" fill="#e6edf3">Dashboard-as-code + alert</text>
    <text x="586" y="432" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9fb8cc">conversion threshold rule</text>
    <text x="586" y="456" font-size="12.5" font-weight="600" fill="#f0a07a">currently firing at 64%</text>

    <!-- ============ FOOTER NOTE ============ -->
    <rect x="32" y="506" width="836" height="72" rx="10" fill="#16212e" stroke="#2a3949" stroke-width="1"/>
    <rect x="32" y="506" width="5" height="72" rx="2.5" fill="#4cc294"/>
    <text x="60" y="536" font-size="15" font-weight="600" fill="#dbe6f0">The measurement path is deterministic &#8212; zero LLM calls at runtime.</text>
    <text x="60" y="560" font-size="12.5" fill="#8fa3b8">The only model call is inside the observed agent. Funnel reads come back in under a second.</text>

  </g>
</svg>
