    .sub { font-size: 12.5px; fill: #a8bccd; }
    .cap { font-size: 11.5px; fill: #a8bccd; letter-spacing: 1.4px; }
    .num { font-size: 46px; font-weight: 700; }
    .stat{ font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .lbl { font-size: 11.5px; fill: #a8bccd; }
    .val { font-size: 13px; font-weight: 600; fill: #e6edf3; }
