  <text class="cap" x="60" y="348">one trace, expanded</text>
  <text x="60" y="368" font-size="10.5" fill="#a8bccd">plan</text>
  <rect x="130" y="358" width="76" height="13" rx="4" fill="#4a6076"/>
  <text x="60" y="388" font-size="10.5" fill="#a8bccd">validate</text>
  <rect x="214" y="378" width="88" height="13" rx="4" fill="#e0714a"/>
