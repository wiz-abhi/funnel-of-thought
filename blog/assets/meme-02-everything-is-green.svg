  <line x1="214" y1="352" x2="214" y2="414" stroke="#e0714a" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8"/>
  <line x1="316" y1="352" x2="316" y2="414" stroke="#8296a8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8"/>
