  <text x="444" y="392" font-size="11.5" fill="#a8bccd">45 of 125 runs. nothing raised. still green.</text>
  <text class="joke" x="400" y="456" text-anchor="middle">traditional services crash. agents skip their homework and hand it in anyway.</text>
