<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="A naive span counter reports 100 percent compliance while an ordered funnel reports 64 percent, a 36 point gap of 45 traces.">
  <title>Presence vs sequence</title>

  <rect x="0" y="0" width="900" height="640" fill="#0f1720"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- header -->
    <text x="32" y="42" font-size="23" font-weight="600" fill="#e6edf3">Presence vs sequence</text>
    <text x="32" y="68" font-size="14" fill="#93a4b5">125 live traces. Two ways to ask the same question about <tspan font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#b6c6d6">agent.validate</tspan>.</text>

    <!-- ==================== LEFT PANEL : NAIVE COUNTER ==================== -->
    <rect x="32" y="88" width="402" height="420" rx="10" fill="#16212e" stroke="#27384a" stroke-width="1"/>
    <text x="52" y="118" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#8fa3b8">NAIVE COUNTER</text>
    <text x="52" y="139" font-size="13" fill="#6f8398">asks: did the span appear?</text>
    <line x1="52" y1="152" x2="414" y2="152" stroke="#27384a" stroke-width="1"/>

    <rect x="52" y="166" width="152" height="27" rx="6" fill="#101a25" stroke="#2c3d50" stroke-width="1"/>
    <text x="66" y="184" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9fb8cc">GROUP BY name</text>

    <!-- counter rows: everything present, everything equal -->
    <g>
      <text x="52" y="221.5" font-size="13" fill="#a8bccd">agent.plan</text>
      <rect x="190" y="210" width="150" height="14" rx="3" fill="#33475c" stroke="#6d8aa6" stroke-width="1"/>
      <text x="414" y="221.5" font-size="13" fill="#a8bccd" text-anchor="end">125</text>

      <text x="52" y="251.5" font-size="13" fill="#a8bccd">agent.tool</text>
      <rect x="190" y="240" width="150" height="14" rx="3" fill="#33475c" stroke="#6d8aa6" stroke-width="1"/>
      <text x="414" y="251.5" font-size="13" fill="#a8bccd" text-anchor="end">125</text>

      <text x="52" y="281.5" font-size="13" font-weight="600" fill="#7fd7b4">agent.validate</text>
      <rect x="190" y="270" width="150" height="14" rx="3" fill="#24614c" stroke="#4cc294" stroke-width="1.4"/>
      <text x="414" y="281.5" font-size="13" font-weight="600" fill="#7fd7b4" text-anchor="end">125</text>

      <text x="52" y="311.5" font-size="13" fill="#a8bccd">agent.respond</text>
      <rect x="190" y="300" width="150" height="14" rx="3" fill="#33475c" stroke="#6d8aa6" stroke-width="1"/>
      <text x="414" y="311.5" font-size="13" fill="#a8bccd" text-anchor="end">125</text>
    </g>

    <!-- result block -->
    <rect x="52" y="332" width="362" height="104" rx="10" fill="#14251f" stroke="#2f6b52" stroke-width="1"/>
    <circle cx="92" cy="384" r="20" fill="#1d3a30" stroke="#4cc294" stroke-width="1.6"/>
    <path d="M83,384 L89.5,391 L101.5,377" fill="none" stroke="#4cc294" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="371" font-size="13" fill="#9fb8ad">present in 125 of 125 traces</text>
    <text x="126" y="408" font-size="30" font-weight="700" fill="#4cc294">100.0%</text>

    <text x="52" y="470" font-size="12.5" fill="#7d93a8">ships to your dashboard as 100% compliance:</text>
    <text x="52" y="488" font-size="12.5" fill="#7d93a8">every run looks like it validated.</text>

    <!-- ==================== RIGHT PANEL : ORDERED FUNNEL ==================== -->
    <rect x="466" y="88" width="402" height="420" rx="10" fill="#16212e" stroke="#27384a" stroke-width="1"/>
    <text x="486" y="118" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#8fa3b8">ORDERED FUNNEL</text>
    <text x="486" y="139" font-size="13" fill="#6f8398">asks: did they happen in order?</text>
    <line x1="486" y1="152" x2="848" y2="152" stroke="#27384a" stroke-width="1"/>

    <rect x="486" y="166" width="286" height="27" rx="6" fill="#101a25" stroke="#2c3d50" stroke-width="1"/>
    <text x="500" y="184" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9fb8cc">plan &#8594; tool &#8594; validate &#8594; respond</text>

    <!-- funnel step 1 -->
    <text x="486" y="220" font-size="13" fill="#cbd8e4">1 &#183; agent.plan</text>
    <text x="848" y="220" font-size="13" font-weight="600" fill="#4cc294" text-anchor="end">125 &#183; 100.0%</text>
    <rect x="486" y="230" width="362" height="24" rx="4" fill="#24614c" stroke="#4cc294" stroke-width="1.3"/>

    <!-- funnel step 2 -->
    <text x="486" y="282" font-size="13" fill="#cbd8e4">2 &#183; agent.tool</text>
    <text x="848" y="282" font-size="13" font-weight="600" fill="#4cc294" text-anchor="end">125 &#183; 100.0%</text>
    <rect x="486" y="292" width="362" height="24" rx="4" fill="#24614c" stroke="#4cc294" stroke-width="1.3"/>

    <!-- funnel step 3 : the drop -->
    <text x="486" y="344" font-size="13" font-weight="600" fill="#f0a07a">3 &#183; agent.validate</text>
    <text x="848" y="344" font-size="13" font-weight="700" fill="#f0a07a" text-anchor="end">80 &#183; 64.0%</text>
    <rect x="486" y="354" width="231.7" height="24" rx="4" fill="#24614c" stroke="#4cc294" stroke-width="1.3"/>
    <rect x="719.7" y="354" width="128.3" height="24" rx="4" fill="#e0714a" fill-opacity="0.12" stroke="#e0714a" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="783.8" y="370.5" font-size="12" font-weight="700" fill="#f0a07a" text-anchor="middle">&#8722;45 traces</text>

    <!-- funnel step 4 -->
    <text x="486" y="406" font-size="13" fill="#cbd8e4">4 &#183; agent.respond</text>
    <text x="848" y="406" font-size="13" font-weight="600" fill="#f0a07a" text-anchor="end">80 &#183; 64.0%</text>
    <rect x="486" y="416" width="231.7" height="24" rx="4" fill="#24614c" stroke="#4cc294" stroke-width="1.3"/>
    <rect x="719.7" y="416" width="128.3" height="24" rx="4" fill="#e0714a" fill-opacity="0.12" stroke="#e0714a" stroke-width="1.3" stroke-dasharray="4 3"/>

    <text x="486" y="470" font-size="12.5" fill="#7d93a8">45 traces emitted validate before the tool</text>
    <text x="486" y="488" font-size="12.5" fill="#7d93a8">result existed. The funnel does not count them.</text>

    <!-- ==================== BOTTOM BAND ==================== -->
    <rect x="32" y="524" width="836" height="80" rx="10" fill="#241a14" stroke="#7a4a33" stroke-width="1"/>
    <rect x="32" y="524" width="5" height="80" rx="2.5" fill="#e0714a"/>
    <text x="450" y="560" font-size="26" font-weight="700" fill="#f2a583" text-anchor="middle">gap = 36.0pp</text>
    <text x="450" y="586" font-size="15" fill="#cbb3a5" text-anchor="middle">= 45 traces that a counter scores as success</text>

  </g>
</svg>
