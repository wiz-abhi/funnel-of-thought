  <text x="160" y="404" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" letter-spacing="6" fill="#6d8aa6">FUNNEL OF THOUGHT</text>

  <text x="160" y="510" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="600" fill="#e8eef4">Does your agent actually</text>
