# Funnel of Thought — SigNoz installation, cast by Foundry.
#
# `foundryctl cast` stands up SigNoz *and* its MCP server from this one file.
# Our own containers (signoz-funnel-mcp, the observed agent) are NOT here —
# they live in docker-compose.yml and join the `signoz-network` this creates.
#
#   foundryctl forge   # regenerate casting.yaml.lock + pours/ (writes files only)
#   foundryctl cast    # forge, then bring the stack up
#
# Two deliberate departures from the stock `foundryctl gen examples` casting:
#
#   1. spec.signoz.spec.image is PINNED to v0.132.2.
#      The default is `signoz/signoz:latest`. We pin because this project's
#      central finding is a behaviour of the funnel-analytics engine as it
#      shipped in v0.132.2 — the unguarded division that returns
#      `HTTP 500: unsupported value: NaN` on a zero-matching step
#      (SigNoz issue #12143; community PR #12160 implements the fix).
#      Once that PR merges, `latest` will no longer reproduce the crash and a
#      judge following the README would see a different result than the blog
#      describes. Pinning keeps the write-up falsifiable. To observe the FIXED
#      behaviour instead, change this to `signoz/signoz:latest` and re-cast.
#
#   2. spec.mcp.spec.enabled is TRUE.
#      Foundry's default is `false`. SigNoz's MCP server is load-bearing for
#      this project: it is the 41-tool baseline that our funnel MCP server
#      extends, and the README asks you to enumerate its tools. Enabling it
#      here puts it on `signoz-network` with SIGNOZ_URL wired to the
#      in-network apiserver, which is what you want.
#
# Everything else (ingester, ClickHouse, Keeper, Postgres) is left at Foundry's
# defaults on purpose — we are not in the business of re-tuning SigNoz.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  signoz:
    spec:
      image: signoz/signoz:v0.132.2
      version: v0.132.2
  mcp:
    spec:
      enabled: true
